name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build -v .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  generate:
    name: Docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
      - run: go generate ./...
      - name: Check for uncommitted changes
        run: |
          git diff --compact-summary --exit-code || \
            (echo "Run 'make generate' and commit the result." && exit 1)

  test:
    name: Terraform ${{ matrix.terraform }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Provider functions need Terraform 1.8+.
        terraform: ['1.8.*', '1.9.*', '1.10.*', '1.11.*', '1.12.*', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go test -v -cover ./...
